# ============================================================
#  Configuration du systeme multi-agents
# ============================================================

# --- Fournisseur LLM local / compatible OpenAI ---
# provider = openai  (Ollama, llama.cpp server, LM Studio, vLLM, OpenRouter...)
# provider = mock    (aucun moteur requis, reponses deterministes pour tester)
llm.provider=openai

# Ollama          : http://localhost:11434/v1
# llama.cpp server: http://localhost:8080/v1
# LM Studio       : http://localhost:1234/v1
# OpenRouter      : https://openrouter.ai/api/v1
llm.baseUrl=http://localhost:11434/v1

# Modele a utiliser (ex: llama3.1, mistral, qwen2.5, ...)
llm.model=llama3.1

# Cle API (vide pour Ollama / llama.cpp local, requise pour OpenRouter)
llm.apiKey=

# Parametres de generation
llm.temperature=0.3
llm.maxTokens=900
llm.timeoutSeconds=120

# --- Repertoires externes (modifiables sans recompiler) ---
# Prompts systeme des agents
prompts.dir=

# Contexte documentaire de chaque agent : context.dir/<agentId>/*.txt
context.dir=./context

# --- Memoire conversationnelle ---
memory.maxMessages=10

# --- Routage ---
# Seuil de confiance en dessous duquel on retombe sur l'agent generique
router.confidenceThreshold=0.35

# --- Integration Outlook (Microsoft Graph) ---
# Passer outlook.enabled=true et renseigner une application Azure AD.
outlook.enabled=false

# Mode d'authentification :
#   devicecode        -> connexion interactive par code (recommande en local)
#   clientcredentials -> app-only (necessite outlook.clientSecret + outlook.mailbox)
outlook.authMode=devicecode

# Identifiants de l'application Azure AD (app registration)
outlook.tenantId=
outlook.clientId=
outlook.clientSecret=

# Boite ciblee (obligatoire uniquement en mode clientcredentials)
outlook.mailbox=

# Nombre d'emails recuperes
outlook.fetchLimit=10

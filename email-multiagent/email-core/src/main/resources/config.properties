# LLM configuration
# client: mock (offline) or ollama (local server)
llm.client=ollama
llm.model=huihui_ai/llama3.2-abliterate:3b
llm.endpoint=http://localhost:11434
llm.timeout.seconds=120

# Routing
# strategy: hybrid (keyword-first, LLM fallback), llm (LLM-first, keyword fallback), or keyword
routing.strategy=hybrid
routing.threshold=0.5
routing.llm.confidence=0.6
routing.hybrid.confidence=0.6

# RAG
rag.enabled=true
rag.embedding.model=all-minilm:22m
rag.embedding.timeout.seconds=120
rag.topK=3

# UI
ui.language=en

# Memory
memory.max.entries=10

# Mail provider: imap or outlook
mail.provider=imap
mail.top=50

# IMAP (works with Gmail, Fastmail, Yahoo, etc.)
# For Gmail, create an app password and use it here.
imap.host=imap.gmail.com
imap.port=993
imap.ssl=true
imap.folder=INBOX
imap.username=deez15153@gmail.com
imap.password=
imap.userEmail=deez15153@gmail.com

# SMTP (send approved replies)
smtp.host=smtp.gmail.com
smtp.port=587
smtp.starttls=true
smtp.ssl=false
smtp.username=deez15153@gmail.com
smtp.password=



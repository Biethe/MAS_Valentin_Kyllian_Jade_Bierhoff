<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #f6f6f6; }
    </style>
  </head>
  <body>
    <iframe id="app" src="http://127.0.0.1:5173/?embed=1"></iframe>
    <script>
      const app = document.getElementById("app");
      window.addEventListener("message", (event) => {
        if (event.source !== app.contentWindow) return;
        if (!event.data || typeof event.data.type !== "string") return;
        parent.postMessage(event.data, "*");
      });
    </script>
  </body>
</html>
